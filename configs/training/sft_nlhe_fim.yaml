experiment_name: exp1b_sft_fim
env_name: hu_nlhe
base_model: Qwen/Qwen3-4B
enable_thinking: false
enable_fim: true
fim_ratio: 0.20
train_file: data/sft/processed/train_mixed_fim.jsonl
val_file: data/sft/processed/val_sft.jsonl
output_dir: outputs/exp1b_sft_fim_lora
merged_output_dir: outputs/exp1b_sft_fim_merged
use_4bit: true
fp16: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
learning_rate: 1.5e-4
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
max_seq_length: 1024
warmup_ratio: 0.05
seed: 42
