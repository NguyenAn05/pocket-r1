experiment_name: sft_leduc_proto
env_name: leduc
base_model: Qwen/Qwen3-4B
enable_thinking: false
train_file: data/sft/leduc/train_standard.jsonl
val_file: data/sft/leduc/val_sft.jsonl
output_dir: outputs/sft_leduc_lora
merged_output_dir: outputs/sft_leduc_merged
use_4bit: true
fp16: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 2.0e-4
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_seq_length: 768
warmup_ratio: 0.05
seed: 42
